    <line x1="46" y1="35" x2="44" y2="48" />
    <line x1="54" y1="35" x2="56" y2="48" />
    <line x1="38" y1="39" x2="35" y2="50" />
    <line x1="62" y1="39" x2="65" y2="50" />
