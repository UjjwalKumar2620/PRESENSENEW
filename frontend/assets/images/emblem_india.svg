  <!-- Satyameva Jayate (सत्यमेव जयते) in Devanagari -->
  <text x="50" y="117" text-anchor="middle" fill="url(#goldEmblemGrad)" font-family="'Noto Sans Devanagari', 'Mukta', 'Mangal', sans-serif" font-size="9" font-weight="600" letter-spacing="1">सत्यमेव जयते</text>
